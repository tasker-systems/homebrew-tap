name: audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# CI runners are ephemeral, so `brew trust` cannot persist; the env var is the
# deliberate form of the same grant (brew sets it implicitly with a
# deprecation warning otherwise).
env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

jobs:
  formula:
    name: Style, parse, and audit the formulae
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout the tap
        uses: actions/checkout@v7

      - name: Install the tap locally (symlink — no network tap fetch)
        run: |
          TAPS="$(brew --repository)/Library/Taps/tasker-systems"
          mkdir -p "$TAPS"
          ln -s "$PWD" "$TAPS/homebrew-tap"

      - name: brew style
        run: brew style tasker-systems/tap

      - name: brew readall (every formula parses, aliases resolve)
        run: brew readall tasker-systems/tap

      # `brew audit` takes formula references, not a tap name — a two-segment
      # `tasker-systems/tap` parses as formula "tap" in tap "tasker-systems".
      # Iterate the formula files so a new minor needs no workflow edit.
      - name: brew audit (offline, strict)
        run: |
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            echo "== auditing $name =="
            brew audit --strict "tasker-systems/tap/$name"
          done
