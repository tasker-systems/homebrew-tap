name: audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  formula:
    name: Style, parse, and audit the formulae
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout the tap
        uses: actions/checkout@v7

      - name: Install the tap locally (symlink — no network tap fetch)
        run: |
          TAPS="$(brew --repository)/Library/Taps/tasker-systems"
          mkdir -p "$TAPS"
          ln -s "$PWD" "$TAPS/homebrew-tap"

      # Homebrew refuses to load an untrusted third-party tap. The grant only
      # has to outlive this job, so an ephemeral runner trusts it here — not
      # via HOMEBREW_NO_REQUIRE_TAP_TRUST, which brew deprecates for removal.
      - name: Trust the tap
        run: brew trust --tap tasker-systems/tap

      # One deliberate waiver, named inline: FormulaAudit/InstallSteps demands
      # the declarative post_install_steps DSL, which cannot compute the
      # post-install manifest this tap's formula plants (see
      # .rubocop.yml and the template's post_install comment). Any OTHER
      # offense fails the step.
      - name: brew style (waiving FormulaAudit/InstallSteps — see .rubocop.yml)
        run: |
          set -o pipefail
          brew style tasker-systems/tap 2>&1 | tee style.log || true
          TOTAL=$(grep -cE ": (C|W|E): " style.log || true)
          WAIVED=$(grep -c "FormulaAudit/InstallSteps" style.log || true)
          echo "offenses: total=$TOTAL waived=$WAIVED"
          if [ "$TOTAL" != "$WAIVED" ]; then
            echo "::error::unwaived style offenses detected"
            exit 1
          fi
          if [ "$WAIVED" = "0" ] && [ "$(grep -c 'no offenses\|inspected' style.log)" = "0" ]; then
            echo "::error::style produced no verdict"
            exit 1
          fi

      # An untrusted tap is SKIPPED with a warning and exit 0 — a vacuous pass.
      # Refuse that, so a lost trust grant fails here instead of reading nothing.
      - name: brew readall (every formula parses, aliases resolve)
        run: |
          set -o pipefail
          brew readall tasker-systems/tap 2>&1 | tee readall.log
          if grep -q "not trusted" readall.log; then
            echo "::error::readall skipped the tap as untrusted — nothing was read"
            exit 1
          fi

      # `brew audit` takes formula references, not a tap name — a two-segment
      # `tasker-systems/tap` parses as formula "tap" in tap "tasker-systems".
      # Iterate the formula files so a new minor needs no workflow edit.
      - name: brew audit (offline, strict)
        run: |
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            echo "== auditing $name =="
            brew audit --strict "tasker-systems/tap/$name"
          done
